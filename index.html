<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <section>
      <div class="py-14 border-b-2 border-gray-300 mx-auto w-[1110px]">
        <h1 class="font-bold text-[32px] mb-6">Job Application Tracker</h1>

        <div class="flex gap-4">
          <div class="w-[359px] py-5 bg-[#f6ecec78] rounded-md">
            <div class="mx-auto w-[310px]">
              <h1>Total</h1>
              <p id="total-count" class="text-[30px] font-bold">0</p>
            </div>
          </div>

          <div class="w-[359px] py-5 bg-[#f6ecec78] rounded-md">
            <div class="mx-auto w-[310px]">
              <h1>Interview</h1>
              <p
                id="interview-count"
                class="text-green-500 text-[30px] font-bold">
                0
              </p>
            </div>
          </div>

          <div class="w-[359px] py-5 bg-[#f6ecec78] rounded-md">
            <div class="mx-auto w-[310px]">
              <h1>Rejected</h1>
              <p id="rejected-count" class="text-red-500 text-[30px] font-bold">
                0
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= JOB TITLE ================= -->

    <div class="flex justify-between mx-auto w-[1110px] mt-6">
      <h1 class="font-bold text-[24px]">Available Jobs</h1>
      <p id="job-length" class="text-gray-400">0 jobs</p>
    </div>

    <!-- ================= TABS ================= -->

    <div class="flex w-[1110px] mx-auto gap-3 mt-6 mb-5">
      <button class="btn btn-primary rounded-md">All</button>
      <button class="btn text-gray-400 rounded-md">Interview</button>
      <button class="btn text-gray-400 rounded-md">Rejected</button>
    </div>

    <!-- ================= JOB CONTAINER ================= -->

    <section class="mb-10">
      <div id="job-container" class="space-y-6"></div>
    </section>

    <script src="script/login.js"></script>
  </body>
</html>
